# Reusable: review an agent-authored PR with Claude.
#
# Rewritten 2026-08-27 against the action's own canonical example
# (examples/pr-review-comprehensive.yml). The previous version invented its own shape and failed
# eight times; two mistakes mattered:
#   - No `track_progress`, so the session had no PR context and shelled out to `gh` to discover
#     it — every one of those calls was denied and it burned its whole turn budget retrying.
#   - The allow-list granted READING but not POSTING, so even once it could read the diff it had
#     no way to publish a review. That is why "Review" reported success and nothing appeared.
# The machine-readable verdict (--json-schema -> structured_output -> review:* labels) is gone.
# It was a gating nice-to-have that never worked and was never load-bearing: merging is human.
name: agent-review

on:
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: number
      runs_on:
        type: string
        default: '["self-hosted","agent"]'
      ntfy_url:
        type: string
        default: ''
    secrets:
      AGENT_APP_PRIVATE_KEY:
        required: true
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    timeout-minutes: 30
    steps:
      - name: Mint App token
        id: token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.AGENT_APP_CLIENT_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}

      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          token: ${{ steps.token.outputs.token }}
          fetch-depth: 1

      - name: Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.token.outputs.token }}
          # Agent PRs are authored by the App, and the action ignores bot-authored events unless
          # the bot is named here. The login is namespaced by GitHub — fgiannazzo-homelab-agent,
          # not the app name homelab-agent.
          allowed_bots: fgiannazzo-homelab-agent
          # Supplies the PR diff, comments and metadata directly. Without it the session has to
          # go fetch all of that itself, which is what failed repeatedly.
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ inputs.pr_number }}

            This PR was written by an automated agent from a GitHub issue, so weight the review
            accordingly:

            - Does it actually do what the linked issue asked? Scope creep and silent narrowing
              both matter.
            - Correctness first: real bugs, broken assumptions, unhandled failure paths. A change
              that looks right and does not work is the failure mode here — a previous agent PR
              added a 179-line script that was well shaped and reported 2/26 where the truth was
              24/24.
            - Does it follow the conventions already in this repository?
            - Flag anything touching credentials, deleting data, or changing behaviour outside the
              issue's stated scope.
            - This repository is documentation of a live homelab. Treat an invented fact — an IP,
              a count, a status — as a blocking issue, not a nitpick.

            Use inline comments for specific problems and a top-level comment for the overall
            verdict. Be concrete and cite file and line. Do not approve work you have not
            verified, and do not pad the review with praise. If the change is fine, say so
            briefly.
          # Read AND post. The previous version allowed only reads, so the review had nowhere to
          # go. Scoped to these calls rather than blanket Bash because this session reads
          # agent-authored content — the one place prompt injection would actually matter.
          claude_args: |
            --max-turns 40
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

      - name: Notify
        if: always() && inputs.ntfy_url != ''
        run: |
          curl -fsS -H "Title: agent-review PR #${{ inputs.pr_number }}" \
            -d "review ${{ job.status }}" "${{ inputs.ntfy_url }}" >/dev/null || true
